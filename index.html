<!DOCTYPE html>
<html lang="en-ZA" data-theme="light" data-group="1">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="BCAD Year 3 dashboard: next deadline, today's classes, PAS calendar, Semester 2 timetable and every link you use daily.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f7fb">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>BCAD Year 3 Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23111827'/%3E%3Ctext x='32' y='42' font-family='Arial,sans-serif' font-weight='800' font-size='26' fill='%23fff' text-anchor='middle'%3EB3%3C/text%3E%3C/svg%3E">
<script>
(() => {
  "use strict";
  const keys = Object.freeze({ theme: "bcad-theme", group: "bcad-timetable-group", done: "bcad-done-v1", links: "bcad-links-v1" });
  window.BCAD_KEYS = keys;
  const root = document.documentElement;
  let theme = null;
  let group = null;
  try { theme = localStorage.getItem(keys.theme); group = localStorage.getItem(keys.group); } catch { /* storage blocked */ }
  const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches === true;
  root.dataset.theme = theme === "light" || theme === "dark" ? theme : (prefersDark ? "dark" : "light");
  root.dataset.group = group === "2" ? "2" : "1";
  root.dataset.groupChosen = group === "1" || group === "2" ? "yes" : "no";
})();
</script>

<style>
/* =========================================================

   ========================================================= */
/* BCAD Year 3 Dashboard styles.

:root,
[data-theme="light"] {
  color-scheme: light;
  --accent-blue: #0ea5e9;
  --accent-blue-soft: #eff6ff;
  --today-blue: #38bdf8;
  --ui-accent: #111827;
  --ui-accent-contrast: #ffffff;
  --ui-accent-soft: #eef2f7;
  --bg: #f4f7fb;
  --surface: #ffffff;
  --surface-alt: #f8fafc;
  --border: #e5eaf1;
  --border-light: #eef2f7;
  --border-strong: #d6dde8;
  --text: #172033;
  --text-secondary: #41506a;
  --text-dim: #718096;
  --hover-bg: #f7f9fc;
  --shadow: 0 1px 2px rgb(15 23 42 / 4%), 0 8px 24px rgb(15 23 42 / 4%);
  --shadow-raised: 0 12px 32px rgb(15 23 42 / 9%);

  --radius-control: 12px;
  --tooltip-bg: #111827;
  --tooltip-text: #ffffff;

  --insy7314-border: #67e8f9;
  --insy7315: #8b5cf6;
  --insy7315-bg: #ede9fe;
  --insy7315-text: #5b21b6;
  --insy7315-border: #c4b5fd;
  --prog7312: #ec4899;
  --prog7312-bg: #fce7f3;
  --prog7312-text: #9d174d;
  --prog7312-border: #f9a8d4;
  --prog7314: #f97316;
  --prog7314-bg: #ffedd5;
  --prog7314-text: #9a3412;
  --prog7314-border: #fdba74;
  --tt-line: #eef2f7;
  --tt-muted-bg: #f8fafc;
  --sidebar-w: 284px;
  --hot: #dc2626;
  --hot-soft: #fee2e2;
  --warn: #b45309;
  --warn-soft: #fef3c7;
  --good: #15803d;
  --good-soft: #dcfce7;
}

[data-theme="dark"] {
  color-scheme: dark;
  --accent-blue: #38bdf8;
  --accent-blue-soft: rgb(59 130 246 / 14%);
  --ui-accent: #f1f5f9;
  --ui-accent-contrast: #0b1220;
  --ui-accent-soft: rgb(241 245 249 / 11%);
  --bg: #0b1220;
  --surface: #121d2f;
  --surface-alt: #172338;
  --border: #29374d;
  --border-light: rgb(255 255 255 / 7%);
  --border-strong: #3a4a63;
  --text: #f1f5f9;
  --text-secondary: #cbd5e1;
  --text-dim: #94a3b8;
  --hover-bg: rgb(255 255 255 / 4%);

  --shadow-raised: 0 14px 34px rgb(0 0 0 / 28%);

  --tooltip-text: #0f172a;
  --focus-ring: rgb(241 245 249 / 24%);

  --insy7314-bg: rgb(6 182 212 / 16%);
  --insy7314-text: #a5f3fc;
  --insy7314-border: rgb(103 232 249 / 42%);
  --insy7315: #a78bfa;
  --insy7315-bg: rgb(139 92 246 / 18%);
  --insy7315-text: #ddd6fe;
  --insy7315-border: rgb(196 181 253 / 42%);
  --prog7312: #f472b6;
  --prog7312-bg: rgb(236 72 153 / 16%);
  --prog7312-text: #fbcfe8;
  --prog7312-border: rgb(249 168 212 / 42%);
  --prog7314: #fb923c;
  --prog7314-bg: rgb(249 115 22 / 18%);

  --prog7314-border: rgb(253 186 116 / 42%);

  --tt-muted-bg: rgb(255 255 255 / 3%);
  --hot: #f87171;
  --hot-soft: rgb(248 113 113 / 14%);
  --warn: #fbbf24;
  --warn-soft: rgb(251 191 36 / 14%);

  --good-soft: rgb(74 222 128 / 13%);
}

.theme-toggle {
  position: relative;
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  box-shadow: var(--shadow);
  color: var(--text);
  cursor: pointer;
  transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
}

.theme-toggle:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-raised);
  transform: translateY(-1px);
}

.theme-toggle:active {
  transform: translateY(0);
}

.toggle-knob {
  position: relative;
  z-index: 2;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  transition: none;
}

[data-theme="dark"] .theme-toggle {
  background: var(--surface);
  box-shadow: var(--shadow);
}

[data-theme="dark"] .toggle-knob {
  transform: none;
  background: transparent;
  box-shadow: none;
}

.icon-sun,
.icon-moon {
  position: absolute;
  width: 20px;
  height: 20px;
  transition: opacity 180ms ease;
}

.icon-sun {
  color: #f59e0b;
  opacity: 1;
}

.icon-moon {
  color: #c4b5fd;
  opacity: 0;
}

[data-theme="dark"] .icon-sun {
  opacity: 0;
}

[data-theme="dark"] .icon-moon {
  opacity: 1;
}

.calendars-wrapper {
  position: relative;
  width: 100%;
}

.cal-nav {
  position: absolute;
  top: 50%;
  z-index: 30;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  transform: translateY(-50%);
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 4px 14px rgb(15 23 42 / 10%);
  cursor: pointer;
  font-size: 1.25rem;
  font-weight: 900;
  line-height: 1;
  transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease, opacity 150ms ease, transform 150ms ease;
}

.cal-nav:hover {
  border-color: var(--border-strong);
  background: var(--hover-bg);
  box-shadow: 0 7px 18px rgb(15 23 42 / 14%);
  transform: translateY(-50%) scale(1.04);
}

.cal-nav:disabled {
  opacity: 0.48;
  cursor: not-allowed;
  box-shadow: none;
}

.cal-nav-prev {
  left: -20px;
}

.cal-nav-next {
  right: -20px;
}

.calendars-wrapper {
  padding: 0;
}

.calendars {
  display: flex;
  gap: 1rem;
  padding-bottom: 0.25rem;
  overflow-x: auto;
  scroll-behavior: smooth;
  scroll-snap-type: x mandatory;
  scrollbar-width: none;
}

.calendars::-webkit-scrollbar {
  display: none;
}

.cal-slide {
  display: flex;
  flex: 0 0 calc((100% - 2rem) / 3);
  min-width: calc((100% - 2rem) / 3);
  scroll-snap-align: start;
}

.cal {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  background: var(--surface);
}

.cal-title {
  padding-left: 0.1rem;
  color: var(--text);
  font-weight: 800;
}

.cal-title span {
  color: var(--text-dim);
  font-weight: 500;
}

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 0.3rem;
  row-gap: 0.32rem;
  column-gap: 0.25rem;
}

.cal-dow {
  color: var(--text-dim);
  font-weight: 700;
  letter-spacing: 0.08em;
  text-align: center;
  text-transform: uppercase;
}

.cal-day {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  font-weight: 700;
  aspect-ratio: auto;
}

.cal-day.blank {
  visibility: hidden;
}

.cal-day.today {
  z-index: 1;
  border-radius: 50%;
  background: var(--today-blue);
  box-shadow: 0 0 0 3px var(--accent-blue-soft);
  color: #07111f;
  font-weight: 800;
}

.cal-day.today::before {
  display: none;
}

[data-theme="dark"] .cal-day.today {
  color: #07111f;
}

.cal-day.has-event {
  border: 2px solid color-mix(in srgb, var(--event-color, var(--accent-blue)) 62%, #0f172a);
  background: var(--event-bg, var(--accent-blue-soft));
  box-shadow: 0 2px 5px rgb(15 23 42 / 7%);
  color: var(--event-text, var(--text));
  font-weight: 700;
}

.cal-day.has-event.today {
  border-color: color-mix(in srgb, var(--event-color, var(--accent-blue)) 62%, #0f172a);
  background: var(--today-blue);
  box-shadow: 0 0 0 3px var(--accent-blue-soft);
  color: #07111f;
}

[data-theme="dark"] .cal-day.has-event.today {
  color: #07111f;
}

[data-theme="dark"] .cal-day.has-event {
  border-color: var(--event-color, var(--accent-blue));
  box-shadow: 0 2px 6px rgb(0 0 0 / 22%);
}

[data-theme="dark"] .cal-day.has-event.today {
  box-shadow: 0 0 0 3px var(--accent-blue-soft);
}

.cal-day.event-INSY7314 {
  --event-color: var(--insy7314);
  --event-bg: var(--insy7314-bg);
  --event-text: var(--insy7314-text);
}

.cal-day.event-INSY7315 {
  --event-color: var(--insy7315);
  --event-bg: var(--insy7315-bg);
  --event-text: var(--insy7315-text);
}

.cal-day.event-PROG7312 {
  --event-color: var(--prog7312);
  --event-bg: var(--prog7312-bg);
  --event-text: var(--prog7312-text);
}

.cal-day.event-PROG7314 {
  --event-color: var(--prog7314);
  --event-bg: var(--prog7314-bg);
  --event-text: var(--prog7314-text);
}

.cal-day.past {
  opacity: 0.6;
}

.cal-day.has-event.past {
  filter: grayscale(0.5);
  opacity: 0.62;
}

.cal-day.has-event .tip {
  position: absolute;
  bottom: calc(100% + 7px);
  left: 50%;
  z-index: 10;
  display: none;
  min-width: max-content;
  padding: 0.48rem 0.62rem 0.5rem;
  border-radius: 9px;
  background: var(--tooltip-bg);
  box-shadow: 0 6px 18px rgb(0 0 0 / 18%);
  color: var(--tooltip-text);
  font-size: 0.68rem;
  font-weight: 600;
  line-height: 1.25;
  pointer-events: none;
  transform: translateX(-50%);
  white-space: nowrap;
}

.tip-title {
  display: block;
  font-size: 0.72rem;
  font-weight: 800;
}

.cal-day.has-event .tip::after {
  position: absolute;
  top: 100%;
  left: 50%;
  border: 5px solid transparent;
  border-top-color: var(--tooltip-bg);
  content: "";
  transform: translateX(-50%);
}

.cal-day.has-event:hover .tip,
.cal-day.has-event:focus-within .tip {
  display: block;
}

.tip-lecturer {
  display: block;
  margin-top: 0.1rem;
  color: rgb(255 255 255 / 58%);
  font-weight: 500;
}

.tip-days {
  display: inline-flex;
  align-items: center;
  margin-top: 0.32rem;
  padding: 0.14rem 0.38rem;
  border-radius: 999px;
  background: rgb(255 255 255 / 12%);
  color: var(--tooltip-text);
  font-size: 0.63rem;
  font-weight: 800;
  letter-spacing: 0.01em;
}

[data-theme="dark"] .tip-lecturer {
  color: rgb(15 23 42 / 58%);
}

[data-theme="dark"] .tip-days {
  background: rgb(15 23 42 / 9%);
}

.group-switch {
  display: grid;
  flex: 0 0 108px;
  grid-template-columns: repeat(2, 1fr);
  inline-size: 108px;
  min-inline-size: 108px;
  gap: 0.16rem;
  padding: 0.2rem;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.group-btn {
  display: flex;
  min-inline-size: 0;
  min-block-size: 36px;
  align-items: center;
  justify-content: center;
  padding: 0;
  overflow: hidden;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1;
  text-align: center;
  white-space: nowrap;

}

.group-btn-label {

}

.group-btn:hover {

.group-btn:active {

.tt-day-name {

.tt-bg-cell.lunch {

.tt-bg-cell.today-column {

.tt-bg-cell.today-column.lunch {

.tt-lunch-label {
  display: flex;

  justify-content: center;
  height: 100%;
  color: var(--text-dim);

  letter-spacing: 0.14em;

.tt-item.today-column .tt-session,

.tt-session,

  border: 1.5px solid var(--tt-border);

.tt-session {

  flex-direction: column;

.tt-session::after {
  position: absolute;
  top: 0.35rem;

.tt-code {

.tt-module {
  display: -webkit-box;
  margin-top: 0.06rem;
  padding-right: 0.8rem;
  overflow: hidden;
  font-weight: 700;
  line-height: 1.18;
  opacity: 0.9;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;

.tt-meta {

}

.tt-meta span {
  border-radius: 6px;
  background: rgb(255 255 255 / 50%);

[data-theme="dark"] .tt-meta span {

.tt-event {

  --tt-color: var(--prog7314);
  --tt-bg: var(--prog7314-bg);
  --tt-text: var(--prog7314-text);
  --tt-border: var(--prog7314-border);
}

.tt-mobile {
  display: none;
}

.tt-empty {
  padding: 1rem;
  border: 1px dashed var(--border);
  border-radius: 10px;
  background: var(--surface-alt);
  color: var(--text-dim);
  font-size: 0.78rem;
  font-weight: 800;
  text-align: center;
}

.group-btn[aria-checked="true"] {
  background: var(--ui-accent);
  box-shadow: 0 3px 10px rgb(15 23 42 / 13%);
  color: var(--ui-accent-contrast);
}

@media (max-width: 960px) {
  .tt-mobile-day {
    padding: 0;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 13px;
    background: var(--surface);
  }

  .tt-mobile-day[open] {
    border-color: var(--border-strong);
    box-shadow: 0 7px 18px rgb(15 23 42 / 6%);
  }

  .tt-mobile-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem;
    cursor: pointer;
    list-style: none;
  }

  .tt-mobile-summary::-webkit-details-marker {
    display: none;
  }

  .tt-mobile-summary::after {
    color: var(--text-dim);
    content: "+";
    font-size: 1.1rem;
    font-weight: 700;
  }

  .tt-mobile-day[open] .tt-mobile-summary::after {
    content: "−";
  }

  .tt-mobile-day.is-today .tt-mobile-summary {
    background: var(--ui-accent-soft);
  }

  .tt-mobile-date {
    color: var(--text-dim);
    font-size: 0.74rem;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .tt-mobile-name {
    margin-top: 0.1rem;
    color: var(--text);
    font-size: 1.05rem;
    font-weight: 900;
  }

  .tt-mobile-sessions {
    display: grid;
    gap: 0.55rem;
    margin-top: 0;
    padding: 0 0.75rem 0.75rem;
    border-top: 1px solid var(--border-light);
  }

  .tt-mobile .tt-empty {
    margin-top: 0.65rem;
  }

  .tt-mobile .tt-session,
  .tt-mobile .tt-event {
    min-height: 92px;
    margin-top: 0.65rem;
  }

  .tt-mobile .tt-code {
    font-size: 1rem;
  }

  .tt-mobile .tt-module {
    font-size: 0.78rem;
  }

  .tt-mobile .tt-meta span {
    font-size: 0.72rem;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

* {
  margin: 0;
  padding: 0;
}

html {
  scrollbar-gutter: stable;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100dvh;
  overflow-x: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: "Outfit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  transition: background-color 180ms ease, color 180ms ease;
}

button,
input {
  font: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

svg,
img {
  display: block;
  flex: none;
}

ul,
ol {
  list-style: none;
}

:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

kbd {
  display: inline-grid;
  place-items: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--surface-alt);
  color: var(--text-dim);
  font-family: inherit;
  font-size: 0.7rem;
  font-weight: 800;
  line-height: 1;
}

.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  flex: none;
  border-radius: 50%;
  background: var(--tt-color, var(--text-dim));
}

.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
  min-height: 100dvh;
}

.main {
  min-width: 0;
}

.content {
  width: 100%;
  margin-inline: auto;
  padding: 1.6rem clamp(1rem, 2.6vw, 2.25rem) 2.5rem;
}

.sidebar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  height: 100dvh;
  border-right: 1px solid var(--border);
}

.sidebar:focus {
  outline: 0;
}

.sb-top {
  display: flex;
  flex-direction: column;
}

.sb-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem;
  padding-inline: 0.25rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  min-width: 0;
  border-radius: 12px;
}

.brand-mark {
  display: grid;
  place-items: center;
  flex: none;
  background: var(--ui-accent);
  color: var(--ui-accent-contrast);
  font-weight: 900;
  letter-spacing: -0.02em;
}

.brand-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.15;
}

.brand-text strong {
  font-weight: 800;
  letter-spacing: -0.02em;
}

.brand-text small {
  color: var(--text-dim);
  font-size: 0.76rem;
  font-weight: 600;
}

.sidebar .sb-close {
  display: none;
}

.sb-nav {
  display: flex;
  flex-direction: column;
}

.sb-nav button {
  display: flex;
  align-items: center;
  gap: 0.7rem;
  width: 100%;
  padding: 0 0.7rem;
  color: var(--text-secondary);
  font-weight: 700;
  text-align: left;
  transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
}

.sb-nav button svg {
  color: var(--text-dim);
  transition: color 150ms ease;
}

.sb-nav button:hover {
  background: var(--hover-bg);
  color: var(--text);
}

.sb-nav button[aria-current="page"] {
  background: var(--ui-accent);
  color: var(--ui-accent-contrast);
}

.sb-nav button[aria-current="page"] svg {
  color: var(--ui-accent-contrast);
}

.count {
  display: inline-grid;
  place-items: center;
  min-width: 22px;
  height: 22px;
  margin-left: auto;
  padding: 0 0.4rem;
  border-radius: 999px;
  background: var(--ui-accent-soft);
  color: var(--text);
  font-size: 0.72rem;
  font-weight: 800;
}

.sb-nav button[aria-current="page"] .count {
  background: rgb(255 255 255 / 18%);
  color: var(--ui-accent-contrast);
}

[data-theme="dark"] .sb-nav button[aria-current="page"] .count {
  background: rgb(15 23 42 / 12%);
}

.sb-scroll {
  display: flex;
  flex: 1;
  flex-direction: column;
  min-height: 0;
  border-top: 1px solid var(--border-light);
  scrollbar-width: thin;
}

.sb-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.5rem;
  color: var(--text-dim);
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.sb-label small {
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: none;
}

.sb-modules {
  display: flex;
  flex-direction: column;
}

.sb-mod {
  display: grid;
  align-items: center;
  transition: background-color 150ms ease;
}

.sb-mod:hover {
  background: var(--hover-bg);
}

.sb-mod-text {
  flex-direction: column;
  min-width: 0;
  line-height: 1.2;
}

.sb-mod-name {
  overflow: hidden;
  color: var(--text-dim);
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sb-links {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}

.sb-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.sb-link-wrap {
  position: relative;
  min-width: 0;
}

.sb-link {
  display: flex;
  align-items: center;
  min-width: 0;
  border: 1px solid var(--border-light);
  border-radius: 10px;
  font-weight: 700;
  transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}

.sb-link-name {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sb-ico {
  display: grid;
  place-items: center;
  flex: none;
  overflow: hidden;
  border-radius: 6px;
  background: var(--surface);
  font-size: 0.56rem;
  font-weight: 900;
}

.sb-ico img {
  width: 15px;
  height: 15px;
}

.sb-ico.glyph,
.sb-ico.mono {
  background: color-mix(in srgb, var(--tint, #718096) 14%, var(--surface));
  color: var(--tint, var(--text-secondary));
}

.sb-remove {
  position: absolute;
  top: -6px;
  right: -6px;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--surface);
  box-shadow: var(--shadow);
  color: var(--text-dim);
  opacity: 0;
  transition: opacity 150ms ease, color 150ms ease;
}

.sb-link-wrap:hover .sb-remove,
.sb-link-wrap:focus-within .sb-remove {
  opacity: 1;
}

.sb-remove:hover {
  color: var(--hot);
}

@media (hover: none) {
  .sb-remove {
    opacity: 1;
  }
}

.sb-add {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  color: var(--text-dim);
  font-weight: 700;
  transition: border-color 150ms ease, color 150ms ease, background-color 150ms ease;
}

.sb-add:hover {
  border-color: var(--text-dim);
  background: var(--hover-bg);
  color: var(--text);
}

.add-form {
  display: grid;
  grid-column: 1 / -1;
  gap: 0.35rem;
  padding: 0.5rem;
  border: 1.5px dashed var(--border-strong);
  border-radius: 12px;
  background: var(--surface-alt);
}

.input {
  width: 100%;
  min-width: 0;
  height: 36px;
  padding: 0 0.65rem;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--surface);
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 500;
}

.input:focus {
  border-color: var(--border-strong);
  outline: 0;
  box-shadow: 0 0 0 3px var(--focus-ring);
}

.input[aria-invalid="true"] {
  border-color: var(--hot);
}

.add-actions {
  display: flex;
  gap: 0.35rem;
}

.scrim {
  display: none;
}

.mobilebar {
  display: none;
}

.page-head {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
}

.greet {
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.head-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.card {
  min-width: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  background: var(--surface);
}

.sec-title {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.sec-meta {
  color: var(--text-dim);
  font-size: 0.8rem;

}

.sec-link {
  display: inline-flex;
  align-items: center;
  gap: 0.2rem;
  color: var(--text-secondary);
  font-size: 0.82rem;
  font-weight: 700;
  transition: color 150ms ease;
}

.sec-link:hover {
  color: var(--text);
}

.label {
  color: var(--text-dim);
  font-size: 0.78rem;
  font-weight: 700;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  height: 40px;
  padding: 0 1rem;
  border: 1px solid var(--border);
  border-radius: var(--radius-control);
  background: var(--surface);
  color: var(--text);
  font-size: 0.88rem;
  font-weight: 700;
  white-space: nowrap;
  transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
}

.btn:hover:not(:disabled) {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-raised);
  transform: translateY(-1px);
}

.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

.btn-primary {
  border-color: var(--ui-accent);
  background: var(--ui-accent);
  color: var(--ui-accent-contrast);
}

.btn-primary:hover:not(:disabled) {
  border-color: var(--ui-accent);
}

.btn-ghost {
  border-color: transparent;
  background: transparent;
  color: var(--text-secondary);
}

.btn-ghost:hover:not(:disabled) {
  border-color: transparent;
  background: var(--hover-bg);
  box-shadow: none;
  color: var(--text);
  transform: none;
}

.btn-sm {
  height: 34px;
  padding: 0 0.75rem;
  border-radius: 10px;
  font-size: 0.8rem;
}

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text);
  transition: background-color 150ms ease, border-color 150ms ease, opacity 150ms ease;
}

.icon-btn:hover:not(:disabled) {
  border-color: var(--border-strong);
  background: var(--hover-bg);
}

.icon-btn:disabled {
  opacity: 0.4;

}

.icon-btn-sm {
  width: 32px;
  height: 32px;
  border-radius: 9px;
}

.badge {

  align-items: center;
  gap: 0.25rem;
  padding: 0.24rem 0.6rem;
  border-radius: 999px;
  background: var(--ui-accent-soft);
  color: var(--text-secondary);
  font-size: 0.74rem;
  font-weight: 800;
  white-space: nowrap;
}

.badge.hot {
  background: var(--hot-soft);
  color: var(--hot);
}

.badge.warn {
  background: var(--warn-soft);
  color: var(--warn);
}

.badge.soon {
  background: var(--ui-accent);
  color: var(--ui-accent-contrast);
}

.badge.good {
  background: var(--good-soft);
  color: var(--good);
}

.badge.muted {

.empty {
  padding: 1rem;
  border: 1px dashed var(--border);
  border-radius: 12px;
  background: var(--surface-alt);
  color: var(--text-dim);
  font-size: 0.86rem;
  font-weight: 700;
  text-align: center;
}

.onboard {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.65rem 1rem;

  padding: 0.85rem 0.9rem 0.85rem 1.1rem;

  border-radius: var(--radius-card);
  background: var(--surface);
  box-shadow: var(--shadow);

.onboard p {
  flex: 1 1 260px;
  color: var(--text-secondary);
  font-size: 0.9rem;
  font-weight: 500;
}

.onboard strong {
  color: var(--text);
  font-weight: 800;
}

.onboard-actions {
  display: flex;
  gap: 0.4rem;
}

.head-actions .group-switch {
  flex-basis: 132px;
  inline-size: 132px;
  min-inline-size: 132px;
}

.view {
  display: flex;
  flex-direction: column;
}

.ov-top {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
  align-items: stretch;
}

.next-card {
  display: flex;
  flex-direction: column;
}

.nx-title {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.nx-title .dot {
  width: 11px;
  height: 11px;
}

.nx-code {
  color: var(--tt-text);
}

.nx-meta {
  color: var(--text-secondary);
  font-weight: 500;
}

.nx-count {
  display: grid;
}

.nx-unit {
  display: flex;
  border: 1px solid var(--border-light);
  background: var(--surface-alt);
}

.nx-num {
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

.nx-unit:first-child {
  background: var(--tt-bg);
}

.nx-unit:first-child .nx-num,
.nx-unit:first-child .nx-lbl {
  color: var(--tt-text);
}

.nx-lbl {
  color: var(--text-dim);
  font-weight: 800;
  text-transform: uppercase;

.nx-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: auto;
}

.nx-clear {
  margin: 0.6rem 0 0.3rem;
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: -0.02em;

.today-card {
  display: flex;
  flex-direction: column;
}

.agenda {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.agenda > li {
  min-width: 0;
}

.ag {
  position: relative;
  display: grid;
  grid-template-columns: 46px minmax(0, 1fr) auto;
  align-items: center;
  gap: 0.75rem;
  overflow: hidden;
  border: 1.5px solid var(--tt-border);
  border-radius: 12px;
  background: var(--tt-bg);
  color: var(--tt-text);
  transition: transform 150ms ease, box-shadow 150ms ease;

a.ag:hover {
  box-shadow: 0 6px 16px rgb(15 23 42 / 8%);
  transform: translateY(-1px);
}

.ag.is-event {
  border-style: dashed;
}

.ag.is-past {
  opacity: 0.5;
}

.ag.is-now {
  box-shadow: 0 0 0 2px var(--tt-color);
}

.ag-time {
  display: flex;
  flex-direction: column;
  font-size: 0.8rem;
  font-weight: 900;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
}

.ag-time span + span {
  opacity: 0.6;
}

.ag-main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.ag-title,
.ag-sub {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ag-title {
  font-size: 0.92rem;
  font-weight: 800;
}

.ag-sub {
  font-size: 0.75rem;
  font-weight: 600;
  opacity: 0.85;
}

.ag-status {
  font-size: 0.75rem;
  font-weight: 800;
  white-space: nowrap;
}

.ag-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: calc(var(--p, 0) * 100%);
  height: 3px;
  background: var(--tt-color);
}

.ag-next {
  color: var(--text-secondary);
  font-weight: 600;
}

.ag-next b {
  color: var(--text);
  font-weight: 800;
}

.cal-zone {
  container-type: inline-size;
}

.cal-zone-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.5rem 1rem;
}

.cal-zone .calendars-wrapper {
  position: relative;
}

.cal-zone .cal-slide {
  flex: 0 0 calc((100% - 2rem) / 3);

const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

function esc(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
function pad(n) { return String(n).padStart(2, "0"); }
function parseYmd(s) { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function sameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function dayDiff(from, to) {
  return Math.round((Date.UTC(to.getFullYear(), to.getMonth(), to.getDate()) - Date.UTC(from.getFullYear(), from.getMonth(), from.getDate())) / 86400000);
}
function atTime(date, hm) { const [h, m] = hm.split(":").map(Number); return new Date(date.getFullYear(), date.getMonth(), date.getDate(), h, m); }
function fmtShort(d) { return `${DOW3[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; }
function fmtLong(d) { return `${DOW[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function titleCase(s) { return String(s).toLowerCase().replace(/(^|\s)(\S)/g, (m, sp, ch) => sp + ch.toUpperCase()); }
function plural(n, word) { return `${n} ${word}${n === 1 ? "" : "s"}`; }
function hostOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } }
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function durationText(ms) {
  const mins = Math.max(1, Math.round(ms / 60000));
  if (mins < 60) return `${mins} min`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
}
function monogram(name) {
  const words = String(name).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "?";
  return (words.length > 1 ? words[0][0] + words[1][0] : words[0].slice(0, 2)).toUpperCase();
}
function tintFor(name) {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return MONO_TINTS[h % MONO_TINTS.length];
}
function favUrl(url) { return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(hostOf(url))}&sz=64`; }
function normalizeUrl(raw) {
  let s = String(raw || "").trim();
  if (!s) return null;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(s)) s = `https://${s}`;
  try {
    const u = new URL(s);
    if (u.protocol !== "https:" && u.protocol !== "http:") return null;
    if (!u.hostname || (!u.hostname.includes(".") && u.hostname !== "localhost")) return null;
    return u.href;
  } catch {
    return null;
  }
}

/* ---------- Timetable helpers ---------- */
function slotEnd(key) { const s = SLOTS[SLOT_INDEX[key]]; return s ? s.end : key; }
function itemTimes(date, item) { return { start: atTime(date, item.start), end: atTime(date, slotEnd(item.end)) }; }

function dayItems(wk, dayIndex) {
  const data = wk.days[DAY_NAMES[dayIndex]];
  if (!data) return [];
  if (Array.isArray(data)) return data.map((s) => ({ kind: "session", ...s }));
  return [{ kind: "event", ...data, variant: EVENT_VARIANTS.includes(data.variant) ? data.variant : "catchup" }];
}

function weekIndexContaining(date, weeks = weeksFor()) {
  const d = startOfDay(date);
  return weeks.findIndex((w) => { const s = parseYmd(w.weekStart); return d >= s && d < addDays(s, 7); });
}

function autoWeekIndex(now = new Date()) {
  const weeks = weeksFor();
  let ref = startOfDay(now);
  if (ref.getDay() === 6) ref = addDays(ref, 2);
  else if (ref.getDay() === 0) ref = addDays(ref, 1);
  for (let i = 0; i < weeks.length; i += 1) if (ref < addDays(parseYmd(weeks[i].weekStart), 7)) return i;
  return weeks.length - 1;
}

function specialKind(wk) {
  if (/catch up/i.test(wk.title)) return "catchup";
  if (/assess/i.test(wk.title)) return "assessment";
  return "";
}

function weekDisplayName(wk) {
  if (specialKind(wk)) {
    const ev = Object.values(wk.days).find((d) => !Array.isArray(d) && d.variant !== "holiday");
    if (ev) return titleCase(ev.label);
  }
  return wk.title.replace(/\s+(FP\d+)$/i, " · $1");
}

const TERM_START = parseYmd(TIMETABLE[1].weeks[0].weekStart);

function nextScheduled(now) {
  const today = startOfDay(now);
  for (const wk of weeksFor()) {
    const ws = parseYmd(wk.weekStart);
    if (addDays(ws, 7) <= today) continue;
    for (let i = 0; i < 5; i += 1) {
      const date = addDays(ws, i);
      for (const it of dayItems(wk, i)) {
        if (it.kind === "event" && it.variant === "holiday") continue;
        const t = itemTimes(date, it);
        if (t.start > now) return { date, item: it, ...t };
      }
    }
  }
  return null;
}

/* ---------- Deadline helpers ---------- */
function relText(now, d) {
  const n = dayDiff(now, d.day);
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  if (n === -1) return "Yesterday";
  return n > 0 ? `in ${n} days` : `${-n} days ago`;
}

function urgencyClass(now, d) {
  const n = dayDiff(now, d.day);
  if (n <= 1) return "hot";
  if (n <= 3) return "warn";
  if (n <= 7) return "soon";
  return "";
}

function updateCountdown(now) {
  if (!state.heroId) return;
  const d = DEADLINES.find((x) => x.id === state.heroId);
  if (!d) return;
  let s = Math.floor((d.due - now) / 1000);
  if (s <= 0) { renderDynamic(now); return; }
  const days = Math.floor(s / 86400); s -= days * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const mi = Math.floor(s / 60);
  const set = (id, v) => { const el = document.getElementById(id); if (el && el.textContent !== v) el.textContent = v; };
  set("cdD", pad(days));
  set("cdH", pad(h));
  set("cdM", pad(mi));
  set("cdDL", days === 1 ? "day" : "days");
  set("cdSr", `${d.module} ${d.title} is due in ${plural(days, "day")}, ${plural(h, "hour")} and ${plural(mi, "minute")}.`);
}

/* ---------- Today ---------- */
function agendaHtml(it, date, now) {
  const t = itemTimes(date, it);
  const today = sameDay(date, now);
  const status = now >= t.end ? "past" : now >= t.start ? "now" : "upcoming";
  let statusText = "";
  if (today) statusText = status === "now" ? `${durationText(t.end - now)} left` : status === "upcoming" ? `in ${durationText(t.start - now)}` : "Done";
  const cls = ["ag"];
  if (today && status === "now") cls.push("is-now");
  if (today && status === "past") cls.push("is-past");
  const bar = today && status === "now" ? `<span class="ag-bar" style="--p:${((now - t.start) / (t.end - t.start)).toFixed(3)}"></span>` : "";
  const time = `<span class="ag-time"><span>${it.start}</span><span>${slotEnd(it.end)}</span></span>`;
  const st = statusText ? `<span class="ag-status">${statusText}</span>` : "";
  if (it.kind === "event") {
    cls.push("is-event", `ev-${it.variant}`);
    return `<li><div class="${cls.join(" ")}">${time}<span class="ag-main"><span class="ag-title">${esc(titleCase(it.label))}</span></span>${st}${bar}</div></li>`;
  }
  const m = MOD[it.code];
  cls.push(`mod-${it.code}`);
  const inner = `${time}<span class="ag-main"><span class="ag-title"><span class="ag-code">${esc(it.code)}</span> <span class="ag-name">${esc(m ? m.name : "")}</span></span><span class="ag-sub">${esc(it.venue)}${m ? ` · ${esc(m.lecturer[state.group])}` : ""}</span></span>${st}${bar}`;
  if (!m) return `<li><div class="${cls.join(" ")}">${inner}</div></li>`;
  return `<li><a class="${cls.join(" ")}" href="${esc(m.course)}" target="_blank" rel="noopener noreferrer">${inner}</a></li>`;
}

function renderToday(now) {
  const el = $("#today");
  if (!el) return;
  const dayIndex = (now.getDay() + 6) % 7;
  const idx = weekIndexContaining(now);
  const wk = idx >= 0 ? weeksFor()[idx] : null;
  const items = wk && dayIndex < 5 ? dayItems(wk, dayIndex) : [];

  let body;
  if (items.length) {
    body = `<ul class="agenda">${items.map((it) => agendaHtml(it, now, now)).join("")}</ul>`;
  } else {
    let text;
    if (now < TERM_START) text = `The semester starts ${fmtLong(TERM_START)}.`;
    else if (wk && dayIndex >= 5) text = "No classes today. Enjoy the weekend.";
    else if (wk) text = "No classes today.";
    else text = DEADLINES.some((d) => d.due > now) ? "Classes are finished. Focus on your POE submissions." : "The semester is over.";
    body = `<p class="empty">${text}</p>`;
  }

  let nextLine = "";
  if (items.every((it) => itemTimes(now, it).end <= now)) {
    const nx = nextScheduled(now);
    if (nx) {
      const diff = dayDiff(now, nx.date);
      const when = diff === 0 ? `today ${nx.item.start}` : diff === 1 ? `tomorrow ${nx.item.start}` : `${fmtShort(nx.date)}, ${nx.item.start}`;
      nextLine = nx.item.kind === "event"
        ? `<p class="ag-next ev-${nx.item.variant}"><span class="dot"></span><span>Next: <b>${esc(titleCase(nx.item.label))}</b>, ${when}</span></p>`
        : `<p class="ag-next mod-${nx.item.code}"><span class="dot"></span><span>Next class: <b>${nx.item.code}</b>, ${when} in ${esc(nx.item.venue)}</span></p>`;
    }
  }

  el.innerHTML = `
    <h2 class="sec-title today-title">Today</h2>
    ${body}${nextLine}`;
}

/* ---------- Timetable ---------- */
function awayLabel(now, ws) {
  const monday = addDays(startOfDay(now), -((now.getDay() + 6) % 7));
  const n = Math.round(dayDiff(monday, ws) / 7);
  if (n === 0) return "This week";
  if (n === 1) return "Next week";
  if (n === -1) return "Last week";
  return n > 0 ? `In ${n} weeks` : `${-n} weeks ago`;
}

function sessionHtml(it, date, now, name) {
  const m = MOD[it.code];
  if (!m) return "";
  const t = itemTimes(date, it);
  const st = now >= t.end ? " is-past" : "";
  return `<a class="tt-session mod-${it.code}${st}" href="${esc(m.course)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(`${it.code} ${m.name}, ${name} ${it.start} to ${slotEnd(it.end)}, ${it.venue}, ${m.lecturer[state.group]}. Opens course page.`)}">` +
    `<div class="tt-code">${esc(it.code)}</div>` +
    `<div class="tt-module">${esc(m.name)} · ${esc(m.lecturer[state.group])}</div>` +
    `<div class="tt-meta"><span>${it.start} - ${slotEnd(it.end)}</span><span>${esc(it.venue)}</span></div></a>`;
}

function eventHtml(it) {
  return `<div class="tt-event ${it.variant}">${esc(it.label)}</div>`;
}

function weekGridHtml(wk, ws, now, todayCol) {
  let g = `<div class="tt-time-head" style="grid-column:1;grid-row:1">Time</div>`;
  DAY_NAMES.forEach((name, i) => {
    const d = addDays(ws, i);
    g += `<div class="tt-day-head${i === todayCol ? " today-column" : ""}" style="grid-column:${i + 2};grid-row:1"><div><div class="tt-day-date">${d.getDate()} ${MON[d.getMonth()]}${i === todayCol ? " · Today" : ""}</div><div class="tt-day-name">${name}</div></div></div>`;
  });
  SLOTS.forEach((slot, r) => {
    const lunch = slot.key === "12:00";
    g += `<div class="tt-time-cell" style="grid-column:1;grid-row:${r + 2}">${slot.start}</div>`;
    DAY_NAMES.forEach((_, i) => {
      g += `<div class="tt-bg-cell${lunch ? " lunch" : ""}${i === todayCol ? " today-column" : ""}" style="grid-column:${i + 2};grid-row:${r + 2}">${lunch && i === 2 ? '<div class="tt-lunch-label">Lunch</div>' : ""}</div>`;
    });
  });
  DAY_NAMES.forEach((name, i) => {
    const date = addDays(ws, i);
    dayItems(wk, i).forEach((it) => {
      const a = SLOT_INDEX[it.start];
      const b = SLOT_INDEX[it.end];
      if (a === undefined || b === undefined || b < a) return;
      const inner = it.kind === "event" ? eventHtml(it) : sessionHtml(it, date, now, name);
      g += `<div class="tt-item${i === todayCol ? " today-column" : ""}" style="grid-column:${i + 2};grid-row:${a + 2} / span ${b - a + 1}">${inner}</div>`;
    });
  });
  if (todayCol >= 0) g += `<div class="tt-nowcol" style="grid-column:${todayCol + 2};grid-row:2 / span ${SLOTS.length}"><div id="ttNow" class="tt-now" hidden></div></div>`;
  return g;
}

function weekMobileHtml(wk, ws, now, todayCol) {
  return DAY_NAMES.map((name, i) => {
    const date = addDays(ws, i);
    const items = dayItems(wk, i);
    const open = i === todayCol || (todayCol < 0 && i === 0);
    const body = items.length
      ? items.map((it) => (it.kind === "event" ? eventHtml(it) : sessionHtml(it, date, now, name))).join("")
      : '<div class="tt-empty">No classes scheduled</div>';
    return `<details class="tt-mobile-day${i === todayCol ? " is-today" : ""}"${open ? " open" : ""}>` +
      `<summary class="tt-mobile-summary"><div><div class="tt-mobile-date">${date.getDate()} ${MON[date.getMonth()]}${i === todayCol ? " · Today" : ""}</div><div class="tt-mobile-name">${name}</div></div></summary>` +
      `<div class="tt-mobile-sessions">${body}</div></details>`;
  }).join("");
}

function renderTimetable(now) {
  const el = $("#tt");
  if (!el) return;
  const weeks = weeksFor();
  state.ttIndex = clamp(state.ttIndex, 0, weeks.length - 1);
  const wk = weeks[state.ttIndex];
  const ws = parseYmd(wk.weekStart);
  let todayCol = -1;
  for (let i = 0; i < 5; i += 1) if (sameDay(addDays(ws, i), now)) todayCol = i;
  const away = awayLabel(now, ws);
  const atAuto = state.ttIndex === autoWeekIndex(now);
  const weekend = now.getDay() === 0 || now.getDay() === 6;
  const openDays = new Set($$("#tt .tt-mobile-day").map((d, i) => (d.open ? i : -1)).filter((i) => i >= 0));
  const sameWeek = el.dataset.week === String(state.ttIndex);

  keepFocus(() => {
    el.innerHTML = `
      <div class="tt-card-head">
        <div>
          <h2 class="tt-week-title">${esc(weekDisplayName(wk))}${atAuto ? "" : ` <span class="tt-away">${away}</span>`}</h2>
        </div>
        <div class="tt-head-right">
          <a class="quiet-link tt-official" href="${esc(SOURCES.timetable)}" target="_blank" rel="noopener noreferrer">Official timetable ${icon("arrow", 13, 2.4)}</a>
          <div class="tt-nav">
            <button class="icon-btn" type="button" data-action="week" data-dir="-1" data-fk="week-prev" aria-label="Previous week" title="Previous week (left arrow)"${state.ttIndex <= 0 ? " disabled" : ""}>${icon("left", 16, 2.4)}</button>
            <button class="btn btn-sm" type="button" data-action="week" data-dir="0" data-fk="week-now" title="Jump to this week (T)"${atAuto ? " disabled" : ""}>${weekend ? "Coming week" : "This week"}</button>
            <button class="icon-btn" type="button" data-action="week" data-dir="1" data-fk="week-next" aria-label="Next week" title="Next week (right arrow)"${state.ttIndex >= weeks.length - 1 ? " disabled" : ""}>${icon("right", 16, 2.4)}</button>
          </div>
        </div>
      </div>
      <div class="tt-grid" aria-label="${esc(`${weekDisplayName(wk)} timetable, Group ${state.group}`)}">${weekGridHtml(wk, ws, now, todayCol)}</div>
      <div class="tt-mobile" aria-label="${esc(`${weekDisplayName(wk)} timetable by day`)}">${weekMobileHtml(wk, ws, now, todayCol)}</div>`;
  });
  if (sameWeek && openDays.size) $$("#tt .tt-mobile-day").forEach((d, i) => { d.open = openDays.has(i); });
  el.dataset.week = String(state.ttIndex);
  updateNowLine(now);
}

function updateNowLine(now = new Date()) {
  const el = $("#ttNow");
  if (!el) return;
  const p = (now.getHours() * 60 + now.getMinutes() - 8 * 60) / (SLOTS.length * 60);
  el.hidden = p < 0 || p > 1;
  el.style.setProperty("--p", clamp(p, 0, 1).toFixed(4));
}

function shiftWeek(dir) {
  const now = new Date();
  const next = dir === 0 ? autoWeekIndex(now) : clamp(state.ttIndex + dir, 0, weeksFor().length - 1);
  if (next === state.ttIndex) return;
  state.ttIndex = next;
  renderTimetable(now);
}

/* ---------- Deadlines ---------- */
function deadlineRowHtml(d, now, nextId) {
  const m = MOD[d.module];
  const past = d.due <= now;
  const done = isDone(d);
  const cls = ["dl", `mod-${d.module}`];
  if (past) cls.push("is-past");
  if (done) cls.push("is-done");
  if (d.id === nextId) cls.push("is-next");
  const badge = done
    ? `<span class="badge good">${icon("check", 11, 3)} Submitted</span>`
    : `<span class="badge ${past ? "muted" : urgencyClass(now, d)}">${relText(now, d)}</span>`;
  return `
    <div id="dl-${d.id}" class="${cls.join(" ")}">
      <label class="chk" title="${done ? "Untick" : "Tick once submitted"}">
        <input type="checkbox" data-done="${d.id}" data-fk="done-${d.id}"${done ? " checked" : ""} aria-label="${esc(`${d.module} ${d.title} submitted`)}">
        <span class="chk-box">${icon("check", 12, 3)}</span>
      </label>
      <span class="dl-date"><span class="dl-day">${d.day.getDate()}</span><span class="dl-dow">${DOW3[d.day.getDay()]}</span></span>
      <span class="dl-main">
        <span class="dl-title"><span class="dl-code">${d.module}</span> <span class="dl-name">${esc(d.title)}</span></span>
        <span class="dl-sub"><span class="dl-modname">${esc(m.name)} · </span>${esc(m.lecturer[state.group])}</span>
      </span>
      <span class="dl-tail">
        ${badge}
        <span class="dl-actions">
          <a class="icon-btn icon-btn-sm" href="${esc(m.course)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(`Open ${d.module} course page`)}" title="Open course">${icon("arrow", 14)}</a>
        </span>
      </span>
    </div>`;
}

function renderDeadlines(now) {
  const el = $("#dlPanel");
  if (!el) return;
  const nextId = upcoming(now)[0]?.id;
  const upCount = DEADLINES.filter((d) => d.due > now).length;
  const pastCount = DEADLINES.length - upCount;
  let list = DEADLINES.filter((d) => state.filter === "all" || d.module === state.filter);
  if (!state.showPast) list = list.filter((d) => d.due > now);
  const months = [...new Set(list.map((d) => d.day.getMonth()))];

  const filters = `<div class="filters" role="group" aria-label="Filter by module">
        <button class="chip" type="button" data-action="filter" data-filter="all" data-fk="filter-all" aria-pressed="${state.filter === "all"}">All</button>
        ${MODULES.map((m) => `<button class="chip mod-${m.code}" type="button" data-action="filter" data-filter="${m.code}" data-fk="filter-${m.code}" aria-pressed="${state.filter === m.code}" title="${esc(m.name)}"><span class="dot"></span>${m.code}</button>`).join("")}
      </div>`;

  const groups = months.map((mi) => {
    const rows = list.filter((d) => d.day.getMonth() === mi);
    return `<div class="dl-group"><h3 class="dl-month">${MONTHS[mi]}</h3>${rows.map((d) => deadlineRowHtml(d, now, nextId)).join("")}</div>`;
  }).join("");

  const pastToggle = pastCount
    ? `<button class="sec-link dl-past-toggle" type="button" data-action="toggle-past" data-fk="toggle-past">${state.showPast ? "Hide past" : `Show past (${pastCount})`}</button>`
    : "";

  keepFocus(() => {
    el.innerHTML = `
      <h2 class="sr-only">Deadlines</h2>
      <div class="dl-head">
        ${filters}
        <span class="dl-head-right"><span class="sec-meta">All due 23:59</span><a class="quiet-link" href="${esc(SOURCES.pas)}" target="_blank" rel="noopener noreferrer">Official PAS ${icon("arrow", 13, 2.4)}</a></span>
      </div>
      ${groups || '<p class="empty">No deadlines to show.</p>'}
      ${pastToggle ? `<div class="dl-foot">${pastToggle}</div>` : ""}`;
  });
}

/* ---------- PAS calendar ---------- */
const cal = { index: 0, anchor: 0, frame: 0, built: false, resizing: false };

function buildCalendar() {
  const scroller = $("#calScroller");
  if (!scroller) return;
  let html = "";
  for (let m = 0; m < 12; m += 1) {
    const first = new Date(CAL_YEAR, m, 1);
    const offset = first.getDay();
    const count = new Date(CAL_YEAR, m + 1, 0).getDate();
    let cells = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].map((d) => `<div class="cal-dow" aria-hidden="true">${d}</div>`).join("");
    // Always six week rows (blank where the month has no days), so every month card has the same square shape.
    for (let i = 0; i < offset; i += 1) cells += '<div class="cal-day blank" aria-hidden="true"></div>';
    for (let d = 1; d <= count; d += 1) {
      const date = new Date(CAL_YEAR, m, d);
      const weekend = date.getDay() === 0 || date.getDay() === 6;
      cells += `<div class="cal-day${weekend ? " weekend" : ""}" data-date="${ymd(date)}">${d}</div>`;
    }
    for (let i = offset + count; i < 42; i += 1) cells += '<div class="cal-day blank" aria-hidden="true"></div>';
    html += `<div class="cal-slide"><div class="cal" data-month="${m}"><div class="cal-title">${MONTHS[m]}</div><div class="cal-grid">${cells}</div></div></div>`;
  }
  scroller.innerHTML = html;
  scroller.addEventListener("scroll", () => {
    cancelAnimationFrame(cal.frame);
    cal.frame = requestAnimationFrame(syncCalFromScroll);
  }, { passive: true });
  cal.built = true;
}

function calDayStatus(now, d) {
  if (isDone(d)) return "Submitted";
  const n = dayDiff(now, d.day);
  if (n > 1) return `${n} days left`;
  if (n === 1) return "1 day left";
  if (n === 0) return "Due today";
  if (n === -1) return "Due 1 day ago";
  return `Due ${-n} days ago`;
}

function renderCalendar(now) {
  if (!cal.built) buildCalendar();
  const scroller = $("#calScroller");
  if (!scroller) return;
  const today = startOfDay(now);
  $$(".cal-day[data-date]", scroller).forEach((cell) => {
    const date = parseYmd(cell.dataset.date);
    cell.classList.toggle("past", date < today);
    cell.classList.toggle("today", sameDay(date, now));
    if (sameDay(date, now)) cell.setAttribute("aria-current", "date");
    else cell.removeAttribute("aria-current");
    if (cell.classList.contains("has-event")) {
      cell.className = cell.className.replace(/\s?(has-event|event-\S+|is-done|tip-open)/g, "");
      cell.querySelector(".tip")?.remove();
      ["role", "tabindex", "data-action", "data-id", "aria-label", "aria-expanded"].forEach((a) => cell.removeAttribute(a));
    }
  });
  DEADLINES.forEach((d) => {
    const cell = scroller.querySelector(`.cal-day[data-date="${ymd(d.day)}"]`);
    if (!cell) return;
    const m = MOD[d.module];
    const status = calDayStatus(now, d);
    cell.classList.add("has-event", `event-${d.module}`);
    if (isDone(d)) cell.classList.add("is-done");
    cell.setAttribute("role", "button");
    cell.tabIndex = 0;
    cell.dataset.action = "cal-tip";
    cell.setAttribute("aria-expanded", "false");
    cell.dataset.id = d.id;
    cell.setAttribute("aria-label", `${d.day.getDate()} ${MONTHS[d.day.getMonth()]}: ${d.module} ${d.title}, ${m.lecturer[state.group]}. ${status}.`);
    cell.insertAdjacentHTML("beforeend", `<span class="tip" aria-hidden="true"><span class="tip-title">${esc(d.title)}</span><span class="tip-lecturer">${d.module} · ${esc(m.lecturer[state.group].split(" ")[0])}</span><span class="tip-days">${status}</span></span>`);
  });
  updateCalControls();
}

// Tapping or clicking a deadline day pins its tooltip; tapping it again or anywhere else closes it.
function closeCalTips(except) {
  $$("#calScroller .cal-day.tip-open").forEach((c) => { if (c !== except) { c.classList.remove("tip-open"); c.setAttribute("aria-expanded", "false"); } });
}

function toggleCalTip(cell) {
  closeCalTips(cell);
  const open = !cell.classList.contains("tip-open");
  cell.classList.toggle("tip-open", open);
  cell.setAttribute("aria-expanded", String(open));
}

function calSlides() { return $$("#calScroller .cal-slide"); }

function calVisible() {
  const sc = $("#calScroller");
  const slides = calSlides();
  if (!sc || !slides.length || !sc.clientWidth) return 1;
  const gap = parseFloat(getComputedStyle(sc).columnGap) || 0;
  return Math.max(1, Math.round((sc.clientWidth + gap) / (slides[0].getBoundingClientRect().width + gap)));
}

function calScrollTo(index, smooth = true) {
  const sc = $("#calScroller");
  const slides = calSlides();
  if (!sc || !slides.length) return;
  cal.anchor = clamp(index, 0, 11);
  cal.index = clamp(index, 0, Math.max(0, 12 - calVisible()));
  sc.scrollTo({ left: slides[cal.index].offsetLeft - slides[0].offsetLeft, behavior: smooth && !reduceMotion() ? "smooth" : "instant" });
  updateCalControls();
}

function syncCalFromScroll() {
  if (cal.resizing) return;
  const sc = $("#calScroller");
  const slides = calSlides();
  if (!sc || slides.length < 2) return;
  const step = slides[1].offsetLeft - slides[0].offsetLeft;
  if (step > 0) {
    cal.index = clamp(Math.round(sc.scrollLeft / step), 0, Math.max(0, 12 - calVisible()));
    cal.anchor = cal.index;
  }
  updateCalControls();
}

function updateCalControls() {
  const prev = $("#calPrev");
  const next = $("#calNext");
  if (!prev || !next) return;
  const visible = calVisible();
  prev.disabled = cal.index <= 0;
  next.disabled = cal.index >= 12 - visible;
  const end = Math.min(11, cal.index + visible - 1);
  $("#calScroller")?.setAttribute("aria-label", `PAS calendar showing ${MONTHS[cal.index]}${end > cal.index ? ` to ${MONTHS[end]}` : ""} ${CAL_YEAR}`);
}

/* ---------- Deadlines count in the sidebar ---------- */
function renderCounts(now) {
  const n = upcoming(now).length;
  $$("[data-count]").forEach((el) => { el.textContent = n ? String(n) : ""; el.hidden = !n; });
}

/* ---------- Everything ---------- */
function renderDynamic(now = new Date()) {
  renderGreeting(now);
  renderNext(now);
  renderToday(now);
  renderModules(now);
  renderDeadlines(now);
  renderCalendar(now);
  renderCounts(now);
}

function renderAll(now = new Date()) {
  renderDynamic(now);
  renderTimetable(now);
}

/* =========================================================
   5. ACTIONS
   ========================================================= */

function setView(view, { updateUrl = true } = {}) {
  if (!VIEWS.includes(view)) view = "overview";
  closeDrawer();
  const changed = state.view !== view;
  state.view = view;
  $$("[data-view-panel]").forEach((panel) => {
    const on = panel.dataset.viewPanel === view;
    panel.hidden = !on;
  });
  $$("[data-nav]").forEach((btn) => {
    if (btn.dataset.view === view) btn.setAttribute("aria-current", "page");
    else btn.removeAttribute("aria-current");
  });
  if (updateUrl) {
    try { history.replaceState(null, "", view === "overview" ? location.pathname + location.search : `#${view}`); } catch { /* sandboxed */ }
  }
  if (changed) window.scrollTo({ top: 0, behavior: "auto" });
  if (view === "timetable") updateNowLine();
  if (view === "overview") calScrollTo(cal.anchor, false);
}

function setGroup(group, { announce = false } = {}) {
  if (group !== "1" && group !== "2") return;
  const changed = group !== state.group;
  state.group = group;
  store.set(KEYS.group, group);
  const ob = $("#onboard");
  if (ob) ob.hidden = true;
  $$("[data-action='group']").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.group === group)));
  if (changed) {
    state.ttIndex = autoWeekIndex();
    renderAll();
  }
  if (announce) toast(`Showing Group ${group}`);
}

function applyTheme(theme) {
  root.dataset.theme = theme;
  const meta = $('meta[name="theme-color"]');
  if (meta) meta.content = getComputedStyle(document.body).backgroundColor || meta.content;
}

function toggleTheme() {
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
  store.set(KEYS.theme, next);
}

function setDone(id, value) {
  const d = DEADLINES.find((x) => x.id === id);
  if (!d) return;
  if (value) state.done.add(id);
  else state.done.delete(id);
  saveDone();
  keepFocus(() => renderDynamic(new Date()));
  if (value) toast(`${d.module} ${d.title} ticked as submitted`, { label: "Undo", run: () => setDone(id, false) });
}

function openDrawer() { document.body.classList.add("drawer-open"); $("#sidebar")?.focus?.(); }
function closeDrawer() { document.body.classList.remove("drawer-open"); }

/* ---------- Toast ---------- */
let toastTimer = 0;
function hideToast() { $("#toast")?.classList.remove("show"); }
function toast(message, action) {
  const el = $("#toast");
  if (!el) return;
  el.innerHTML = `<span>${esc(message)}</span>${action ? `<button type="button">${esc(action.label)}</button>` : ""}`;
  if (action) el.querySelector("button").addEventListener("click", () => { hideToast(); action.run(); }, { once: true });
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, action ? 6000 : 2800);
}

function goThisWeek() {
  state.ttIndex = autoWeekIndex();
  renderTimetable(new Date());
  setView("timetable");
}

/* =========================================================
   6. EVENTS
   ========================================================= */

function bindEvents() {
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-action]");
    if (!t || t.dataset.action !== "cal-tip") closeCalTips();
    if (!t || t.tagName === "INPUT") return;
    const { action, id } = t.dataset;
    switch (action) {
      case "view": e.preventDefault(); setView(t.dataset.view); break;
      case "theme": toggleTheme(); break;
      case "group": setGroup(t.dataset.group, { announce: t.hasAttribute("data-announce") }); break;
      case "done": setDone(id, true); break;
      case "cal-tip": toggleCalTip(t); break;
      case "week": shiftWeek(Number(t.dataset.dir)); break;
      case "filter": state.filter = t.dataset.filter; renderDeadlines(new Date()); break;
      case "toggle-past": state.showPast = !state.showPast; renderDeadlines(new Date()); break;
      case "add-link": openAddForm(); break;
      case "cancel-add": closeAddForm(); break;
      case "remove-link": {
        const index = state.links.findIndex((l) => l.id === id);
        if (index < 0) break;
        const [removed] = state.links.splice(index, 1);
        saveLinks();
        renderLinks();
        toast(`Removed ${removed.name}`, { label: "Undo", run: () => { state.links.splice(index, 0, removed); saveLinks(); renderLinks(); } });
        break;
      }
      case "menu": document.body.classList.contains("drawer-open") ? closeDrawer() : openDrawer(); break;
      case "close-drawer": closeDrawer(); break;
      default: break;
    }
  });

  document.addEventListener("change", (e) => {
    const input = e.target.closest?.("input[data-done]");
    if (input) setDone(input.dataset.done, input.checked);
  });

  document.addEventListener("submit", (e) => {
    if (e.target.id !== "addForm") return;
    e.preventDefault();
    const urlInput = $("#addUrl");
    const url = normalizeUrl(urlInput.value);
    if (!url) {
      urlInput.setAttribute("aria-invalid", "true");
      urlInput.focus();
      toast("That link does not look right. Try something like example.com");
      return;
    }
    const name = ($("#addName").value.trim() || hostOf(url)).slice(0, 60);
    state.links.push({ id: `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, name, url });
    saveLinks();
    state.adding = false;
    renderLinks();
    $('[data-action="add-link"]')?.focus();
    toast(`Added ${name}`);
  });

  document.addEventListener("input", (e) => { if (e.target.id === "addUrl") e.target.removeAttribute("aria-invalid"); });

  // Your own links use the site's icon. When there is none (or only the generic globe), show initials instead.
  const useMonogram = (img) => {
    const holder = img.parentElement;
    if (!holder) return;
    holder.classList.add("mono");
    holder.style.setProperty("--tint", img.dataset.tint || "#71717a");
    holder.textContent = (img.dataset.mono || "•").slice(0, 2);
  };
  document.addEventListener("error", (e) => { if (e.target instanceof HTMLImageElement && e.target.classList.contains("fav")) useMonogram(e.target); }, true);
  document.addEventListener("load", (e) => { const img = e.target; if (img instanceof HTMLImageElement && img.classList.contains("fav") && img.naturalWidth <= 16) useMonogram(img); }, true);

  // Group radios: arrow keys.
  $$("[role='radiogroup']").forEach((rg) => rg.addEventListener("keydown", (e) => {
    if (!["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(e.key)) return;
    e.preventDefault();
    const next = state.group === "1" ? "2" : "1";
    setGroup(next);
    rg.querySelector(`[data-group="${next}"]`)?.focus();
  }));

  // Swipe sideways on the timetable to change week.
  let touch = null;
  document.addEventListener("touchstart", (e) => {
    if (!e.target.closest?.("#tt .tt-grid, #tt .tt-mobile")) { touch = null; return; }
    const t = e.touches[0];
    touch = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (!touch) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x;
    const dy = t.clientY - touch.y;
    touch = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.6) shiftWeek(dx < 0 ? 1 : -1);
  }, { passive: true });

  // Keyboard shortcuts.
  document.addEventListener("keydown", (e) => {
    const key = e.key;
    if (key === "Escape" && $("#calScroller .tip-open")) { closeCalTips(); return; }
    if (key === "Escape") {
      if (e.target.closest?.("#addForm")) { e.preventDefault(); closeAddForm(); return; }
      if (document.body.classList.contains("drawer-open")) { closeDrawer(); return; }
    }
    const target = e.target;
    if ((key === "Enter" || key === " ") && target.matches?.('[role="button"][data-action]')) { e.preventDefault(); target.click(); return; }
    if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
    if (target.closest?.("input, textarea, select, [contenteditable='true']")) return;
    switch (key) {
      case "1":
      case "2":
      case "3": setView(VIEWS[Number(key) - 1]); break;
      case "g":
      case "G": setGroup(state.group === "1" ? "2" : "1", { announce: true }); break;
      case "t":
      case "T": goThisWeek(); break;
      case "ArrowLeft":
      case "ArrowRight": {
        if (target.closest?.("[role='radiogroup']")) return;
        const dir = key === "ArrowLeft" ? -1 : 1;
        if (state.view === "timetable") { e.preventDefault(); shiftWeek(dir); }
        else if (state.view === "overview" && !target.closest?.(".sidebar")) { e.preventDefault(); calScrollTo(cal.index + dir); }
        break;
      }
      default: break;
    }
  });

  window.addEventListener("hashchange", () => setView(location.hash.slice(1) || "overview", { updateUrl: false }));

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    const now = new Date();
    if (ymd(now) !== state.lastDay) {
      state.lastDay = ymd(now);
      state.ttIndex = autoWeekIndex(now);
      renderAll(now);
    } else {
      renderDynamic(now);
      renderTimetable(now);
    }
  });
}

/* ---------- Clock ---------- */
function tick() {
  const now = new Date();
  updateCountdown(now);
  const minute = Math.floor(now.getTime() / 60000);
  if (minute === state.lastMinute) return;
  state.lastMinute = minute;
  const dayKey = ymd(now);
  if (dayKey !== state.lastDay) {
    state.lastDay = dayKey;
    state.ttIndex = autoWeekIndex(now);
    renderAll(now);
    if (now.getFullYear() === CAL_YEAR) calScrollTo(now.getMonth());
    return;
  }
  renderGreeting(now);
  renderToday(now);
  if (weekIndexContaining(now) === state.ttIndex) renderTimetable(now);
}

function loop() {
  tick();
  setTimeout(loop, 1000 - (Date.now() % 1000) + 8);
}

/* =========================================================
   7. INIT
   ========================================================= */

function init() {
  const now = new Date();
  state.lastDay = ymd(now);
  state.lastMinute = Math.floor(now.getTime() / 60000);
  state.ttIndex = autoWeekIndex(now);

  $$("[data-src]").forEach((a) => { const url = SOURCES[a.dataset.src]; if (url) a.href = url; });
  $$("[data-action='group']").forEach((b) => b.setAttribute("aria-checked", String(b.dataset.group === state.group)));
  if (root.dataset.groupChosen !== "yes") { const ob = $("#onboard"); if (ob) ob.hidden = false; }

  // Phones and tablets: group switch and theme toggle live in the top bar.
  const headActions = $(".head-actions");
  const phoneQuery = window.matchMedia("(max-width: 960px)");
  const placeHeadActions = () => (phoneQuery.matches ? $(".mobilebar") : $(".page-head"))?.appendChild(headActions);
  if (headActions) { placeHeadActions(); phoneQuery.addEventListener?.("change", placeHeadActions); }

  bindEvents();
  renderLinks();
  renderAll(now);
  $("#calPrev")?.addEventListener("click", () => calScrollTo(cal.index - 1));
  $("#calNext")?.addEventListener("click", () => calScrollTo(cal.index + 1));
  cal.index = now.getFullYear() === CAL_YEAR ? now.getMonth() : now.getFullYear() < CAL_YEAR ? 0 : 11;
  let resizeTimer = 0;
  window.addEventListener("resize", () => {
    cal.resizing = true;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      cal.resizing = false;
      if (state.view === "overview") calScrollTo(cal.anchor, false);
    }, 150);
  }, { passive: true });
  applyTheme(root.dataset.theme === "dark" ? "dark" : "light");
  setView(location.hash.slice(1) || "overview", { updateUrl: false });
  requestAnimationFrame(() => calScrollTo(now.getFullYear() === CAL_YEAR ? now.getMonth() : cal.index, false));
  document.fonts?.ready?.then(() => calScrollTo(cal.anchor, false));

  setTimeout(loop, 1000 - (Date.now() % 1000) + 8);
}

init();

})();
</script>
</body>
